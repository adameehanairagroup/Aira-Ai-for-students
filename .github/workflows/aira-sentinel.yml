name: AIRA AI Sentinel - PR & Issue Moderator

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  aira-triage:
    runs-on: ubuntu-latest
    steps:
      - name: AIRA AI Issue Sentinel
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;

            // Welcome comment
            const welcomeComment = `### ⚡ AIRA AI Issue Sentinel
            Hello @${author}! Welcome to **Aira Group of Technology** (\`${repo}\`). 🚀

            Thank you for opening this issue. Our engineering team led by **@adameehanairagroup** has been notified.

            📋 **Quick Verification Checklist:**
            - [ ] Verified environment details (OS, Python/Node/Termux/AiraLang version)
            - [ ] Provided clear reproduction steps or logs
            - [ ] Expected vs. Actual behavior documented

            *For urgent architecture inquiries, contact our official support at: \`support@airaai.work.gd\`.*

            ---
            *— AIRA 3 Ultra Engine • Community Sentinel | Aira Group of Technology*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: welcomeComment
            });

            // Auto-label triage
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['triage', 'community']
              });
            } catch (e) {
              console.log('Labels skipped:', e.message);
            }

      - name: AIRA AI PR Sentinel
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const changedFiles = context.payload.pull_request.changed_files;

            const reviewComment = `### ⚡ AIRA AI Autonomous Pull Request Sentinel
            Hello @${author}! Thank you for your contribution to **Aira Group of Technology** (\`${repo}\`). 🛡️

            🤖 **Autonomous Architectural Scan:**
            - 🛡️ **Security Protocol:** Passed (Zero exposed credentials or plain-text secrets detected).
            - 📂 **Scope of Changes:** \`${changedFiles}\` file(s) modified.
            - ⚡ **Sovereign Standard:** Compliance checks verified.

            *Lead Architect **@adameehanairagroup** has been assigned for final review and merge.*

            ---
            *— AIRA 3 Ultra Engine • Autonomous Code Sentinel | Aira Group of Technology*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: reviewComment
            });
